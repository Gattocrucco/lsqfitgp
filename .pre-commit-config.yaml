# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# revs are frozen to commit SHAs (tags are mutable); update with
# 'pre-commit autoupdate --freeze'

# cached test results, compressed json
exclude: '^tests/cached/'
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg, pre-merge-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^uv\.lock$
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-submodules
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: name-tests-test
        args: [--pytest-test-first]
        exclude: ^tests/(util\.py|_.+\.py|fast-hash/.*)$
      - id: trailing-whitespace
      - id: no-commit-to-branch
  - repo: https://github.com/sbrunner/hooks
    rev: 60041b789c098988bd01ddff70e7e3a31c1700f1  # frozen: 1.8.0
    hooks:
      # config in .github/copyright.yaml, adapted to the `Copyright (c) 2022, 2026,
      # 2023, 2024, Giacomo Petrillo` year lists of the GPL headers
      - id: copyright
      - id: copyright-required
        files: \.(py|rst)$
        # generated headerless file; untracked, so it only reaches hooks via
        # an explicit `pre-commit run --files`
        exclude: src/lsqfitgp/_version\.py$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/DanielNoord/pydocstringformatter
    rev: b658f517409a0864b20fa9d9aa3d178a37fb7f22  # frozen: v1.0.0
    hooks:
      - id: pydocstringformatter
        # config in [tool.pydocstringformatter] (pyproject.toml); the hook
        # already passes --write --quiet. Scoped to the library, whose numpy
        # docstring conventions this enforces; drop `files` to widen.
        files: ^src/lsqfitgp/.*\.py$
  - repo: https://github.com/jsh9/pydoclint
    rev: 24412c5f73ad438a08146132ea86a9a72c8bd5ad  # frozen: 0.11.0
    hooks:
      - id: pydoclint
  - repo: https://github.com/henryiii/validate-pyproject-schema-store
    rev: 562b381732c1d2bec9a3a66cc89f63e16d486470  # frozen: 2026.09.30
    hooks:
      - id: validate-pyproject
  - repo: https://github.com/jorisroovers/gitlint
    rev: acc9d9de6369b76d22cb4167029d2035e8730b98 # frozen: v0.19.1
    hooks:
      - id: gitlint # this is already defined to run in stage commit-msg
  # this rev is the single uv pin: .github/actions/setup-uv installs the version
  # in its `frozen` comment in every workflow, and config/check_workarounds.py
  # reads it as the oldest supported uv, so the uv that writes uv.lock here and
  # the one that reads it on ci cannot drift apart. Both parse the comment on
  # the line right below the repo, keep it there.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0f4b65a503cc866b9b5e62dda2020f7943b01a65  # frozen: 0.12.22
    hooks:
      - id: uv-lock
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: lint-merged-tree
        name: full lint on the merged tree
        # Runs only at merge time (not on ordinary commits). Gates clean
        # auto-merges, whose merge commit git writes without invoking the
        # `pre-commit` stage: catches a merged tree that fails the hooks even
        # though each branch passed in isolation (e.g. a stale WORKAROUND or a
        # hook config changed on one side). `make lint` is `pre-commit run
        # --all-files`; nesting it here is safe (this hook is not in the
        # pre-commit stage, so --all-files does not re-trigger it).
        entry: make lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-merge-commit]
      - id: check-workarounds
        name: check stale WORKAROUND markers
        entry: uv run --dev python config/check_workarounds.py
        language: system
        pass_filenames: false
        always_run: true
      - id: check-path-headers
        name: check the `lsqfitgp/<path>` comment matches each file's location
        entry: uv run --dev python config/check_path_headers.py
        language: system
        # self-scopes to files carrying the lsqfitgp license header; `text` just
        # keeps binaries out of the argument list.
        types: [text]
      - id: ty
        name: ty check
        # there is no official ty pre-commit hook (and an isolated hook env
        # would not see the project venv anyway), so run the dev-pinned ty.
        # pre-commit feeds it the tracked python files: only the staged ones on
        # a commit (fast incremental check), and all of them under `--all-files`
        # — the comprehensive gate run by `make lint` and at merge time.
        entry: uv run --dev ty check --
        language: system
        types: [python]
      - id: check-returns-docstring
        name: forbid multi-line non-list `Returns` docstring sections
        # Matches a numpy-style `Returns` block whose first two non-blank lines
        # are both at the section's base indent: i.e., multi-line prose. List-
        # form (description on a more-indented continuation line) is skipped via
        # `(?P=i)\S`; the trailing lookahead skips the next section's header.
        language: pygrep
        entry: '^(?P<i>[ \t]*)Returns[ \t]*\n(?P=i)-+[ \t]*\n(?P=i)(?!""")\S[^\n]*\n(?:[ \t]*\n)*(?P=i)(?!""")(?!\w+[ \t]*\n(?P=i)-+[ \t]*$)\S'
        args: [--multiline]
        types: [python]
      - id: forbid-jax-vmap-jit-qualified-call
        name: forbid qualified `jax.vmap`/`jax.jit` (use `from jax import vmap, jit`)
        language: pygrep
        # Matches the qualified name as a word (`\b`) so call sites (`jax.jit(`),
        # bare decorators (`@jax.jit`), and references (`partial(jax.jit, ...)`)
        # are all caught. The `(?!`)` negative lookahead skips docstring/comment
        # mentions, which are wrapped in backticks (`` `jax.jit` ``).
        entry: '\bjax\.(vmap|jit)\b(?!`)'
        types: [python]
      - id: forbid-jax-random-qualified-call
        name: forbid `jax.random.foo(...)` (use `from jax import random`)
        language: pygrep
        # the trailing `\(` limits matches to function calls so docstrings that
        # mention `jax.random` are not flagged.
        entry: '\bjax\.random\.\w+\s*\('
        types: [python]
      - id: forbid-dunder-all
        name: forbid setting `__all__` in modules
        language: pygrep
        # matches any module-level `__all__` statement (plain/annotated/augmented
        # assignments, `.append`/`.extend`, `del`, etc.). The `^` anchor restricts
        # to column 0, so references inside indented code or docstrings are ignored.
        entry: '^__all__\b'
        types: [python]
