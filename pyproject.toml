[build-system]
# the old toolchain (`make tests-old`) builds the package with the newest
# versions available at OLD_DATE, so the floors must not be newer than that
requires = ["hatchling>=1.25,<2", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[project]
name = "lsqfitgp"
dynamic = ["version"]
authors = [
  { name="Giacomo Petrillo", email="info@giacomopetrillo.com" },
]
description = "A general purpose Gaussian process regression module"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Development Status :: 3 - Alpha",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "jax>=0.6.2",
    "jaxlib>=0.6.2",
    "gvar>=13.1.7",
]

[project.urls]
Homepage = "https://github.com/Gattocrucco/lsqfitgp"
Documentation = "https://gattocrucco.github.io/lsqfitgp/docs"
Issues = "https://github.com/Gattocrucco/lsqfitgp/issues"

# The version is derived from git: the latest v* tag, plus a .devN+g<commit>
# suffix if the tagged commit is not checked out.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/lsqfitgp/_version.py"
template = '''# file generated by hatch-vcs, do not edit or track in version control
__version__ = {version!r}
__version_info__ = {version_tuple!r}
'''

[tool.hatch.build.targets.wheel]
packages = ["src/lsqfitgp"]

[tool.hatch.build.targets.sdist]
only-include = ["src/lsqfitgp"]

# The floors follow the OLD_DATE policy, see `make update-oldest-deps`. The
# old toolchain (`make tests-old`) installs `dev` at the floors, and swaps
# `docs`, which is only needed for the examples and the documentation, with the
# empty `old` group.
[dependency-groups]
dev = [
    "appnope>=0.1.4",
    "coverage[toml]>=7.10.7",
    "diff-cover>=9.7.1",
    "ipython>=8.37.0",
    "matplotlib>=3.10.6",
    "mpmath>=1.3.0",
    "packaging>=25.0",
    "pandas>=2.3.3",
    "polars>=1.34.0",
    "pre-commit>=4.3.0",
    "pyarrow>=21.0.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "pytest-xdist>=3.8.0",
    # vendored shellcheck for the actionlint hook: pinned here so its presence
    # and version don't depend on a system install. `uv run` puts it on PATH,
    # where actionlint finds it; absent it, actionlint silently skips shellcheck.
    "shellcheck-py>=0.11.0.1",
    "statsmodels>=0.14.5",
    "tomli>=2.2.1",
    # lint (and hence ty) only ever runs on the latest toolchain, so the old
    # version is installed but unused
    "ty>=0.0.2",
]
docs = [
    "lsqfit>=13.3.1",
    "myst-parser>=4.0.1",
    "numpydoc>=1.9.0",
    "pygments>=2.19.2",
    "sphinx>=8.1.3",
    "tabulate>=0.9.0",
    "tqdm>=4.67.1",
]
# selects the old toolchain, see `conflicts` below
old = []

[tool.uv]
default-groups = ["dev", "docs"]
# uv resolves all the groups together even if only some are installed, so
# without this the requirements of `docs` would constrain the old toolchain;
# e.g., lsqfit needs gvar>=13, which would hide the gvar floor.
conflicts = [[{ group = "docs" }, { group = "old" }]]
# rebuild the git-derived version on new commits/tags; needs uv >= 0.11.20 to
# work in worktrees (uv#19706).
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
# dependency cooldown: exclude versions newer than this from resolution.
# `make update-python-deps` pins it to an absolute UTC instant (see
# config/update_cooldown.py) so the release lock and the uv-lock pre-commit hook
# resolve the same cutoff and don't churn uv.lock; don't edit the value by hand.
exclude-newer = '2026-09-26T00:00:00Z'

[tool.pytest.ini_options]
cache_dir = "config/pytest_cache"
testpaths = ["tests"]
filterwarnings = [
    'ignore:JAX on Mac ARM machines',
    'ignore:the imp module is deprecated',
    'ignore:k >= N for N \* N square matrix',
    'ignore:Passing None has been deprecated',
    'ignore:minimization failed. Desired error not necessarily achieved due to precision loss\.',
    'ignore:in the future the `\.dtype` attribute of a given datatype object must be a valid dtype instance\. `data_type\.dtype` may need to be coerced using `np\.dtype\(data_type\.dtype\)`\. \(Deprecated NumPy 1\.20\)',
    'ignore:The problem size .+? minus the constraints size .+? is too small',
]
addopts = [
    "-r xXfE",
    "--pdbcls=IPython.terminal.debugger:TerminalPdb",
    "--durations=3",
]

# the default import mode (prepend) puts the repository root in `sys.path`,
# which makes `from tests import util` work in the tests.

[tool.coverage.run]
branch = true
# static context for the unit tests; the examples and the documentation code
# override it (see the Makefile). Per-test dynamic contexts are not used because
# with ~10k tests they bloat the data files to >100 MB.
context = "tests"
# the make targets write the data of each run to .coverage.<run> and combine them
# into this file, see the Makefile
data_file = ".coverage-combined"
source_pkgs = ["lsqfitgp", "tests"]
# src/lsqfitgp/_version.py is generated by hatch-vcs
omit = ["src/lsqfitgp/_version.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.html]
show_contexts = true

[tool.coverage.paths]
# the first path in each list must be the source directory in the machine that's
# generating the coverage report

src = [
    'src/lsqfitgp/',
    '/home/runner/work/lsqfitgp/lsqfitgp/src/lsqfitgp/',
    '/Users/runner/work/lsqfitgp/lsqfitgp/src/lsqfitgp/',
    'C:\a\lsqfitgp\lsqfitgp\src\lsqfitgp\',
    'D:\a\lsqfitgp\lsqfitgp\src\lsqfitgp\',
]

tests = [
    'tests/',
    '/home/runner/work/lsqfitgp/lsqfitgp/tests/',
    '/Users/runner/work/lsqfitgp/lsqfitgp/tests/',
    'C:\a\lsqfitgp\lsqfitgp\tests\',
    'D:\a\lsqfitgp\lsqfitgp\tests\',
]

[tool.ruff]
# src/lsqfitgp/_version.py is generated by hatch-vcs and gitignored
exclude = ["*.ipynb", "src/lsqfitgp/_version.py"]
cache-dir = "config/ruff_cache"

[tool.ruff.format]
quote-style = "single"
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false
# a developer checkout of jax at the project root would make isort
# auto-detect it as first-party, so import sorting would differ between dev
# machines and CI. Pin it.
known-third-party = ["jax"]

[tool.ruff.lint]
# typographic characters used on purpose: the multiplication sign in formatted
# uncertainties, en dashes in page ranges, quotes in the punctuation of
# BagOfWords
allowed-confusables = ["×", "–", "‘", "’", "‚"]
# pydoclint codes, used in `noqa` comments read by the pydoclint hook
external = ["DOC"]
select = [
    "ICN",  # flake8-import-conventions
    "ERA",  # eradicate
    "S",    # flake8-bandit
    "BLE",  # flake8-blind-except
    "B",    # bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "CPY",  # flake8-copyright
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "EM",   # flake8-errmsg
    "EXE",  # flake8-executable
    "FIX",  # flake8-fixme
    "ISC",  # flake8-implicit-str-concat
    "INP",  # flake8-no-pep420
    "PIE",  # flake8-pie
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SLF",  # flake8-self
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "FLY",  # flynt
    "I",    # isort
    "C90",  # mccabe
    "NPY",  # NumPy-specific rules
    "PERF", # Perflint
    "W",    # pycodestyle Warning
    "F",    # pyflakes
    "D",    # pydocstyle
    "PGH",  # pygrep-hooks
    "PLC",  # Pylint Convention
    "PLE",  # Pylint Error
    "PLR",  # Pylint Refactor
    "PLW",  # Pyling Warning
    "UP",   # pyupgrade
    "FURB", # refurb
    "RUF",  # Ruff-specific rules
    "TRY",  # tryceratops
    # "ANN" (flake8-annotations) is not selected: lsqfitgp documents types in
    # the numpydoc docstrings instead of annotating signatures.
]
ignore = [
    "B028",    # warn with stacklevel = 2
    "C408",    # Unnecessary `dict()` call (rewrite as a literal), it's too convenient for kwargs
    "D105",    # Missing docstring in magic method
    "ERA001",  # Found commented-out code. lsqfitgp keeps commented-out alternative implementations and checks as notes, and has comments with math and shapes that look like code.
    "PIE790",  # Unnecessary ... or pass. Ignored because sometimes I use ... as sentinel to tell the rest of ruff and pyright that an implementation is a stub.
    "PLR0912", # Too many branches; ignore bc C901 already handles this
    "PLR0913", # Too many arguments in function definition. Maybe I should do something about this?
    "PLR0917", # Too many positional arguments. Fixing means keyword-only signatures everywhere, a big mechanical change; deferred.
    "PLR2004", # Magic value used in comparison, consider replacing `*` with a constant variable
    "PLW2901", # `for` loop variable overwritten. lsqfitgp normalizes loop variables in place (`for x in xs: x = asarray(x)`), using a second name would leave the raw value around to be used by mistake.
    "RET505",  # Unnecessary `{branch}` after `return` statement. I ignore this because I like to keep branches for readability.
    "RET506",  # Unnecessary `else` after `raise` statement. I ignore this because I like to keep branches for readability.
    "RUF036",  # `None` not at the end of a union. Ignored because None is often semantic and ordered meaningfully in the hint.
    "S101",    # Use of `assert` detected. Too annoying.
    "SIM108",  # SIM108 Use ternary operator `*` instead of `if`-`else`-block, I find blocks more readable
    "SLF001",  # Private member accessed. In lsqfitgp a leading underscore marks names internal to the package, not to the class or module.
]

[tool.ruff.lint.per-file-ignores]
"{config/*,docs/*,examples/*}" = [
    "D100",   # Missing docstring in public module
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D104",   # Missing docstring in public package
    "INP001", # File * is part of an implicit namespace package. Add an `__init__.py`.
]
"{config/*,docs/*,examples/*,tests/*}" = [
    "T201", # `print` found
]
"{docs/*,examples/*}" = [
    "NPY002", # Replace legacy `np.random` call. The scripts seed the global generator to reproduce the figures in the manual.
]
"tests/fast-hash/*" = [
    "INP001", # File * is part of an implicit namespace package, the directory holds a script
]
"tests/*" = [
    "SLF001", # Private member accessed: `*`
    "TID253", # `{module}` is banned at the module level
]
"docs/conf.py" = [
    "BLE001",  # Do not catch blind exception, linkcode_resolve gives up on any error
    "PERF203", # `try`-`except` within a loop
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.flake8-unused-arguments]
# `*args, **kw` in signatures fixed by an interface
ignore-variadic-names = true

[tool.ruff.lint.flake8-copyright]
min-file-size = 1

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-import-conventions.aliases]
"jax.numpy" = "jnp"

[tool.ruff.lint.flake8-import-conventions]
banned-from = ["jax.random", "jax.lax", "jax.numpy", "jax.tree", "math"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"jax.numpy.exp2".msg = "Use `2 ** x` because `exp2(<integer>)` is not exact"
"jax.lax.exp2".msg = "Use `2 ** x` because `exp2(<integer>)` is not exact"
"jax.lax.reciprocal".msg = "Use jnp.reciprocal"
"jax.random.PRNGKey".msg = "User jax.random.key"
"jax.tree_util.tree_all".msg = "Use jax.tree.all"
"jax.tree_util.tree_flatten".msg = "Use jax.tree.flatten"
"jax.tree_util.tree_flatten_with_path".msg = "Use jax.tree.flatten_with_path"
"jax.tree_util.tree_leaves".msg = "Use jax.tree.leaves"
"jax.tree_util.tree_leaves_with_path".msg = "Use jax.tree.leaves_with_path"
"jax.tree_util.tree_map".msg = "Use jax.tree.map"
"jax.tree_util.tree_map_with_path".msg = "Use jax.tree.map_with_path"
"jax.tree_util.tree_reduce".msg = "Use jax.tree.reduce"
"jax.tree_util.tree_structure".msg = "Use jax.tree.structure"
"jax.tree_util.tree_transpose".msg = "Use jax.tree.transpose"
"jax.tree_util.tree_unflatten".msg = "Use jax.tree.unflatten"

[tool.pydoclint]
style = "numpy"
# lsqfitgp documents argument types in the docstrings, not in the signatures
arg-type-hints-in-signature = false
arg-type-hints-in-docstring = true
check-return-types = false
check-yield-types = false
treat-property-methods-as-class-attributes = true
check-style-mismatch = true
show-filenames-in-every-violation-message = true
allow-init-docstring = true
check-class-attributes = false
# numpydoc recommends to list in "Raises" only the non-obvious errors, while
# pydoclint wants all the exceptions raised in the body, including the many
# input checks
skip-checking-raises = true

[tool.pydocstringformatter]
# numpydoc-only style: this leaves out the pep257 `split-summary-body`
# formatter, which mis-splits wrapped attribute docstrings at the first
# physical line (and then inserts mid-sentence periods via `final-period`).
style = ["numpydoc"]
# keep the closing `"""` inline on attribute docstrings.
closing-quotes = false

[tool.ty.rules]
# error on stale `ty: ignore` comments, e.g., ignores for diagnostics fixed by
# typing improvements in our dependencies
unused-ignore-comment = "error"
# lsqfitgp has no type annotations, so ty can only infer types, and on this
# dynamic code (attributes set in `__new__` or by other mixins, heterogeneous
# containers, arguments that are None until defaulted, subclasses that
# deliberately change method signatures) these rules yield almost only false
# positives. The rules about names, imports and call arity are kept.
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-method-override = "ignore"
no-matching-overload = "ignore"
not-subscriptable = "ignore"
not-iterable = "ignore"
unsupported-operator = "ignore"
invalid-assignment = "ignore"
